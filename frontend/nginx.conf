server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real file (i.e. every client-side
    # route like /infrastructure, /kubernetes) serves index.html so React
    # Router can handle it — without this, a hard refresh on /kubernetes
    # would 404 at the nginx level before React ever gets a chance to route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
