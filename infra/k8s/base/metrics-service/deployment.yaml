apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: data
  labels:
    app: metrics-service
    part-of: cloud-native-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
    spec:
      containers:
        - name: metrics-service
          image: metrics-service:latest  # replaced by CI with the built image digest — see .github/workflows/deploy.yml
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: metrics-service-config
            - secretRef:
                name: metrics-service-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://platform:$(DB_PASSWORD)@postgres:5432/metrics_service"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
