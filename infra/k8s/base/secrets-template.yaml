# THIS FILE IS A TEMPLATE / DOCUMENTATION ONLY — it is intentionally NOT
# applied as-is (no `kubectl apply -f this-file` in any deploy workflow;
# check .github/workflows/deploy.yml, it isn't referenced there).
#
# Real deployments populate these Secrets via one of:
#   - External Secrets Operator, syncing from AWS Secrets Manager / GCP
#     Secret Manager (recommended — matches the architecture doc's §10
#     security design: secrets live in a managed secret store, K8s
#     Secrets are a synced projection of them, not the source of truth)
#   - `kubectl create secret` run manually by an operator with real values,
#     piped from a password manager — acceptable for small teams, not
#     scalable past a handful of services
#
# Each service's Deployment references `<name>-secrets` via envFrom (see
# generate_manifests.py's DEPLOYMENT_TEMPLATE) — this file documents what
# KEYS each one expects, with placeholder (never real) values.

apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: auth
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  JWT_PRIVATE_KEY_PATH: "/run/secrets/jwt/private_key.pem"  # mounted via a separate Secret volume, see below

---
# The JWT keypair (Module 2): private key mounted ONLY into auth-service;
# every other service gets only the public key, matching the RS256
# asymmetric-signing design from Module 1 — a compromised service other
# than auth-service can verify tokens but never mint them.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keypair
  namespace: auth
type: Opaque
stringData:
  private_key.pem: "REPLACE_ME"
  public_key.pem: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: genai-log-analysis-service-secrets
  namespace: ai
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"  # omit entirely to run in fallback-only mode — see Module 10

---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-storage-service-secrets
  namespace: platform
type: Opaque
stringData:
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: platform
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"  # optional — see Module 11
  SMTP_HOST: "REPLACE_ME"          # optional

# Every other DB-backed service (monitoring, metrics, k8s-management,
# traffic-prediction, predictive-maintenance) follows the same
# `DB_PASSWORD` + JWT public key shape as auth-service above — omitted
# here for brevity, not because they're different; see
# generate_manifests.py's render_configmap() for exactly which env vars
# each service's Deployment expects.
