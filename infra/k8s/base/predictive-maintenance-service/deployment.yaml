apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance-service
  namespace: ai
  labels:
    app: predictive-maintenance-service
    part-of: cloud-native-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictive-maintenance-service
  template:
    metadata:
      labels:
        app: predictive-maintenance-service
    spec:
      containers:
        - name: predictive-maintenance-service
          image: predictive-maintenance-service:latest  # replaced by CI with the built image digest — see .github/workflows/deploy.yml
          ports:
            - containerPort: 8007
          envFrom:
            - configMapRef:
                name: predictive-maintenance-service-config
            - secretRef:
                name: predictive-maintenance-service-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://platform:$(DB_PASSWORD)@postgres:5432/predictive_maintenance_service"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8007
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
