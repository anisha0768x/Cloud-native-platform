apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-storage-service
  namespace: platform
  labels:
    app: cloud-storage-service
    part-of: cloud-native-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-storage-service
  template:
    metadata:
      labels:
        app: cloud-storage-service
    spec:
      containers:
        - name: cloud-storage-service
          image: cloud-storage-service:latest  # replaced by CI with the built image digest — see .github/workflows/deploy.yml
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: cloud-storage-service-config
            - secretRef:
                name: cloud-storage-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
