# Per the master architecture doc (§8): namespaces split by bounded
# context, not one flat namespace — this gives each area its own RBAC
# boundary and resource quota, and contains blast radius (a
# misconfigured NetworkPolicy in `ai` can't accidentally also affect
# `auth` if they're genuinely separate namespaces).
apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
