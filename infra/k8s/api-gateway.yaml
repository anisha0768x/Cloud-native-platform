apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: platform
  labels: {app.kubernetes.io/name: api-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: api-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: api-gateway}}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/cloud-native-platform/api-gateway:replace-with-sha
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: platform-runtime}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: platform}
spec:
  selector: {app.kubernetes.io/name: api-gateway}
  ports: [{port: 80, targetPort: 8000}]
