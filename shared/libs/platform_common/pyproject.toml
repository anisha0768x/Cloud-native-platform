[project]
name = "platform-common"
version = "0.1.0"
description = "Shared library (config, logging, DB, security, events, health) for all platform microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.0",
    "python-json-logger>=2.0",
    "aiokafka>=0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_common*"]
