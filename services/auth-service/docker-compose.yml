# Auth Service — local dev container definition.
#
# Run from the REPO ROOT (build context must include shared/libs):
#   docker compose -f infra/docker-compose.yml -f services/auth-service/docker-compose.yml up -d --build
#
# This file intentionally only ADDS the auth-service container; it relies
# on `infra/docker-compose.yml` already being loaded first for Postgres/etc
# and the shared `platform-network`.

version: "3.9"

services:
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: platform-auth-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://platform:platform_local_dev_only@postgres:5432/auth_service
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private_key.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public_key.pem
      ACCESS_TOKEN_EXPIRE_SECONDS: "900"
      REFRESH_TOKEN_EXPIRE_SECONDS: "604800"
    volumes:
      # In K8s this becomes a Secret volume mount at the same path — local
      # dev uses the keypair generated by scripts/generate_keys.py so the
      # mechanism (read keys from a mounted file, never from an env var
      # containing raw PEM) matches production exactly.
      - ./keys:/run/secrets/jwt:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: platform-network
    external: true
