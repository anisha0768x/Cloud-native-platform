# Traffic Prediction Service — local dev container.
#
# Run from repo root, layering all compose files:
#   docker compose -f infra/docker-compose.yml \
#                   -f services/auth-service/docker-compose.yml \
#                   -f services/monitoring-service/docker-compose.yml \
#                   -f services/metrics-service/docker-compose.yml \
#                   -f services/k8s-management-service/docker-compose.yml \
#                   -f services/dashboard-service/docker-compose.yml \
#                   -f services/traffic-prediction-service/docker-compose.yml \
#                   -f services/api-gateway/docker-compose.yml \
#                   up -d --build

version: "3.9"

services:
  traffic-prediction-service:
    build:
      context: ../..
      dockerfile: services/traffic-prediction-service/Dockerfile
    container_name: platform-traffic-prediction-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: traffic-prediction-service
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      PORT: "8006"
      DATABASE_URL: postgresql+asyncpg://platform:platform_local_dev_only@postgres:5432/traffic_prediction_service
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public_key.pem
      METRICS_SERVICE_URL: http://metrics-service:8003
      LOOKBACK_HOURS: "504"
      MIN_TRAINING_POINTS: "48"
      REQUESTS_PER_POD_CAPACITY: "200"
      MODEL_CACHE_TTL_SECONDS: "3600"
    volumes:
      - ../auth-service/keys:/run/secrets/jwt:ro
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      metrics-service:
        condition: service_started
    networks:
      - default

networks:
  default:
    name: platform-network
    external: true
